<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>浮點查字（離線版）</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--pg:#f4f5f7;--bg:#fffffff2;--fg:#16181d;--mut:#6b7280;--ac:#0a84ff;--bd:#d0d5dd;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#0f1115;--bg:#1c1f26f2;--fg:#eef0f4;--mut:#9aa3b2;--ac:#4aa3ff;--bd:#3a4050;color-scheme:dark}}
:root[data-theme="dark"]{--pg:#0f1115;--bg:#1c1f26f2;--fg:#eef0f4;--mut:#9aa3b2;--ac:#4aa3ff;--bd:#3a4050;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--pg);color:var(--fg);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
#dot{position:fixed;width:44px;height:44px;touch-action:none;display:flex;align-items:center;justify-content:center;z-index:5;-webkit-tap-highlight-color:transparent}
#dot::after{content:"";width:20px;height:20px;border-radius:50%;background:var(--ac);opacity:.5;box-shadow:0 0 0 4px #0a84ff22;transition:.2s}
#dot:active::after,#dot.on::after{opacity:.9;transform:scale(1.15)}
#panel{position:fixed;z-index:4;background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:10px;box-shadow:0 8px 30px #0003;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:none;box-sizing:border-box}
#panel.open{display:block}
.row{display:flex;gap:6px}
input[type=text]{flex:1;min-width:0;font-size:18px;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--fg);outline:none}
input[type=text]:focus{border-color:var(--ac)}
button,label.b{font-size:18px;border:0;border-radius:10px;background:transparent;color:var(--ac);padding:0 10px}
#out{margin-top:8px;font-size:17px;line-height:1.6;white-space:pre-wrap;max-height:40vh;overflow:auto;min-height:1.5em}
.m{color:var(--mut);font-size:13px}
#bar{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
#bar label.b{font-size:13px;padding:4px 6px;color:var(--mut)}
#add{display:flex;gap:6px;margin-top:6px}
#add input{font-size:15px;padding:6px 10px}
#add button{font-size:15px}
</style></head><body>
<div id="dot" title="點一下查字"></div>
<div id="panel">
  <div class="row"><input id="q" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="輸入英文…" enterkeyhint="search"><button id="spk" title="發音">🔊</button><button id="x" title="收合">✕</button></div>
  <div id="out"><span class="m">輸入英文，即時顯示中文；按 Enter 發音。拖曳小點可移動位置。</span></div>
  <div id="bar"><span class="m" id="cnt"></span><label class="b">匯入字典 CSV<input id="f" type="file" accept=".csv,.txt,text/csv,text/plain" hidden></label></div>
</div>
<script>
const $=s=>document.querySelector(s),dot=$('#dot'),panel=$('#panel'),q=$('#q'),out=$('#out');
const D=Object.create(null),U=Object.create(null);

try{Object.assign(U,JSON.parse(localStorage.getItem('od_u')||'{}'))}catch(e){}
const cnt=()=>{$('#cnt').textContent='字典 '+Object.keys(D).length+'｜我的 '+Object.keys(U).length+' 字'};
function get(w){return U[w]||D[w]||null}
function find(w){
  const m=get(w);if(m)return m;
  const c=[];const dbl=b=>/(.)\1$/.test(b)?b.slice(0,-1):null;
  if(w.endsWith('ies'))c.push(w.slice(0,-3)+'y');
  if(w.endsWith('es'))c.push(w.slice(0,-2));
  if(w.endsWith('s'))c.push(w.slice(0,-1));
  if(w.endsWith('ied'))c.push(w.slice(0,-3)+'y');
  if(w.endsWith('ed')){const b=w.slice(0,-2);c.push(b,w.slice(0,-1));const d=dbl(b);if(d)c.push(d)}
  if(w.endsWith('ing')){const b=w.slice(0,-3);c.push(b,b+'e');const d=dbl(b);if(d)c.push(d)}
  if(w.endsWith('ly'))c.push(w.slice(0,-2));
  if(w.endsWith('er')){c.push(w.slice(0,-2),w.slice(0,-1))}
  if(w.endsWith('est')){c.push(w.slice(0,-3),w.slice(0,-2))}
  if(w.endsWith('ness'))c.push(w.slice(0,-4));
  for(const x of c){const r=get(x);if(r)return r+'  （'+x+' 的變化形）'}
  return null;
}
function showNF(w){
  out.textContent='';
  const t=document.createElement('div');t.textContent='找不到「'+w+'」';out.appendChild(t);
  const a=document.createElement('div');a.id='add';
  const i=document.createElement('input');i.type='text';i.placeholder='輸入中文意思，存入我的字典';
  const b=document.createElement('button');b.textContent='加入';
  b.onclick=()=>{const v=i.value.trim();if(!v)return;U[w]=v;try{localStorage.setItem('od_u',JSON.stringify(U))}catch(e){}cnt();lookup(w,false)};
  a.append(i,b);out.appendChild(a);place();
}
function lookup(text,say){
  const ws=(text.toLowerCase().match(/[a-z][a-z'-]*/g)||[]).map(w=>w.replace(/^['-]+|['-]+$/g,'')).filter(Boolean);
  if(!ws.length){out.innerHTML='<span class="m">輸入英文，即時顯示中文；按 Enter 發音。</span>';place();return}
  if(say)speak(text);
  if(ws.length===1){const m=find(ws[0]);if(m){out.textContent=ws[0]+'\n'+m;place()}else showNF(ws[0]);return}
  out.textContent=ws.map(w=>{const m=find(w);return w+'　'+(m||'？（不在字典）')}).join('\n');place();
}
function speak(w){
  if(!w||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.9;
    const vs=speechSynthesis.getVoices();const v=vs.find(v=>v.lang==='en-US'&&/Samantha|Ava|Allison|Google/i.test(v.name))||vs.find(v=>v.lang==='en-US');
    if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}
}
q.addEventListener('keydown',e=>{if(e.key==='Enter'){lookup(q.value,true);q.select()}});
let tm;q.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>lookup(q.value,false),250)});
$('#spk').onclick=()=>speak(q.value);
$('#f').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const t=(await f.text()).replace(/^\ufeff/,'');let n=0;
    t.split(/\r?\n/).forEach(l=>{const m=l.match(/^\s*"?([A-Za-z][A-Za-z'\- ]*?)"?\s*[,\t]\s*"?(.+?)"?\s*$/);if(m){U[m[1].toLowerCase()]=m[2];n++}});
    try{localStorage.setItem('od_u',JSON.stringify(U))}catch(_){}
    cnt();out.textContent='已匯入 '+n+' 筆。'}catch(err){out.textContent='匯入失敗。'}
  e.target.value='';place();
};
let pos={x:innerWidth-60,y:110};
try{const p=JSON.parse(localStorage.getItem('od_pos'));if(p&&isFinite(p.x))pos=p}catch(e){}
function place(){
  pos.x=Math.min(Math.max(0,pos.x),innerWidth-44);pos.y=Math.min(Math.max(0,pos.y),innerHeight-44);
  dot.style.left=pos.x+'px';dot.style.top=pos.y+'px';
  const w=Math.min(330,innerWidth-16);panel.style.width=w+'px';
  panel.style.left=Math.min(Math.max(8,pos.x+22-w/2),innerWidth-w-8)+'px';
  let t=pos.y+48;if(t+panel.offsetHeight>innerHeight-8)t=Math.max(8,pos.y-panel.offsetHeight-4);
  panel.style.top=t+'px';
}
function toggle(o){const open=o===undefined?!panel.classList.contains('open'):o;panel.classList.toggle('open',open);dot.classList.toggle('on',open);place();if(open)q.focus()}
let sx,sy,ox,oy,moved=false;
dot.addEventListener('pointerdown',e=>{dot.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=pos.x;oy=pos.y;moved=false});
dot.addEventListener('pointermove',e=>{if(!dot.hasPointerCapture(e.pointerId))return;if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>8)moved=true;if(moved){pos.x=ox+e.clientX-sx;pos.y=oy+e.clientY-sy;place()}});
dot.addEventListener('pointerup',()=>{if(moved){try{localStorage.setItem('od_pos',JSON.stringify(pos))}catch(_){}}else toggle()});
$('#x').onclick=()=>toggle(false);
addEventListener('resize',place);
const parse=t=>{let n=0;t.replace(/^\ufeff/,'').split(/\r?\n/).forEach(l=>{const m=l.match(/^\s*"?([A-Za-z][A-Za-z'\- ]*?)"?\s*[,\t]\s*"?(.+?)"?\s*$/);if(m){D[m[1].toLowerCase()]=m[2];n++}});return n};
try{Promise.all([1,2,3,4,5].map(i=>fetch('dict'+i+'.csv').then(r=>r.ok?r.text():'').catch(()=>''))).then(ts=>{let n=0;ts.forEach(t=>{if(t){parse(t);n++}});cnt();if(!n)out.textContent='找不到 dict1.csv（需與 index.html 放在同一資料夾，並用網址開啟）'})}catch(e){}
cnt();place();
const hn=document.createElement('div');hn.textContent='點小點開始查字 ➜';hn.style.cssText='position:fixed;z-index:3;font-size:14px;color:var(--mut);background:var(--bg);padding:5px 10px;border-radius:8px;transition:opacity 1s;pointer-events:none;white-space:nowrap';hn.style.top=(pos.y+8)+'px';hn.style.left=Math.max(8,pos.x-150)+'px';document.body.appendChild(hn);setTimeout(()=>{hn.style.opacity=0},8000);
</script></body></html>
